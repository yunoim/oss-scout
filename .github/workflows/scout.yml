name: OSS Scout weekly

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST (00:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (reports only, no state/Notion/mail)"
        type: boolean
        default: false
      limit:
        description: "Max candidates to audit (blank = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: oss-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # ETag cache: 304 responses do not count against the GitHub rate limit, so keep it between runs.
      - name: Restore ETag cache
        uses: actions/cache@v4
        with:
          path: data/etag_cache.json
          key: etag-cache-${{ github.run_id }}
          restore-keys: etag-cache-

      - name: Run scout
        env:
          # GH_PAT (classic PAT, public_repo) gives 5,000 core req/h; the default token only 1,000/h.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NCP_APIGW_KEY_ID: ${{ secrets.NCP_APIGW_KEY_ID }}
          NCP_APIGW_KEY: ${{ secrets.NCP_APIGW_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m scout.main run $ARGS

      - name: Commit data + reports
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "oss-scout[bot]"
          git config user.email "oss-scout[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "scout: $(date -u +%G-W%V)"
            git push
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/*.md
          if-no-files-found: ignore
